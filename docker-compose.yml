services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgerwatch-postgres
    environment:
      POSTGRES_DB: ledgerwatch
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledgerwatch"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: