services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgerwatch-postgres
    environment:
      POSTGRES_DB: ledgerwatch
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledgerwatch"]
      interval: 10s
      timeout: 5s
      retries: 5

  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    container_name: ledgerwatch-account-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ledgerwatch
      DB_USERNAME: ledger
      DB_PASSWORD: ledger
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8081:8081"

  transaction-service:
    build:
      context: .
      dockerfile: transaction-service/Dockerfile
    container_name: ledgerwatch-transaction-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ledgerwatch
      DB_USERNAME: ledger
      DB_PASSWORD: ledger
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8082:8082"

volumes:
  postgres_data: