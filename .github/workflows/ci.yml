name: CI

on:
  pull_request:
    branches:
      - master
      - dev

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-matrix.outputs.services }}
    steps:
      # No checkout needed: for pull_request events dorny/paths-filter reads
      # the changed-file list from the GitHub API.
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            account-service:
              - 'account-service/**'
            transaction-service:
              - 'transaction-service/**'
            common:
              - 'pom.xml'
              - 'Makefile'
              - '.github/workflows/ci.yml'

      - name: Compute build matrix
        id: set-matrix
        run: |
          services=()
          if [[ "${{ steps.filter.outputs['account-service'] }}" == 'true' || "${{ steps.filter.outputs.common }}" == 'true' ]]; then
            services+=("account-service")
          fi
          if [[ "${{ steps.filter.outputs['transaction-service'] }}" == 'true' || "${{ steps.filter.outputs.common }}" == 'true' ]]; then
            services+=("transaction-service")
          fi
          json=$(printf '%s\n' "${services[@]}" | jq -R . | jq -sc .)
          echo "services=$json" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: Build & Test (${{ matrix.service }}, Java 21)
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run tests
        working-directory: ${{ matrix.service }}
        run: mvn --batch-mode verify

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/
          retention-days: 7
