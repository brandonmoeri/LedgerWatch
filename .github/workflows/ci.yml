name: CI

on:
  pull_request:
    branches:
      - master
      - dev

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      account-service: ${{ steps.filter.outputs['account-service'] }}
      transaction-service: ${{ steps.filter.outputs['transaction-service'] }}
      common: ${{ steps.filter.outputs.common }}
    steps:
      # No checkout needed: for pull_request events dorny/paths-filter reads
      # the changed-file list from the GitHub API.
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            account-service:
              - 'account-service/**'
            transaction-service:
              - 'transaction-service/**'
            common:
              - 'pom.xml'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  build-and-test:
    name: Build & Test (${{ matrix.service }}, Java 21)
    needs: changes
    if: needs.changes.outputs[matrix.service] == 'true' || needs.changes.outputs.common == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [account-service, transaction-service]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run tests
        working-directory: ${{ matrix.service }}
        run: mvn --batch-mode verify

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/
          retention-days: 7
