name: CI

on:
  pull_request:
    branches:
      - master
      - dev

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-matrix.outputs.services }}
      frontend: ${{ steps.filter.outputs.frontend }}
      common: ${{ steps.filter.outputs.common }}
    steps:
      # No checkout needed: for pull_request events dorny/paths-filter reads
      # the changed-file list from the GitHub API.
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            account-service:
              - 'account-service/**'
            transaction-service:
              - 'transaction-service/**'
            frontend:
              - 'frontend/**'
            common:
              - 'common/**'
              - 'pom.xml'
              - 'Makefile'
              - '.github/workflows/ci.yml'

      - name: Compute build matrix
        id: set-matrix
        run: |
          services=()
          if [[ "${{ steps.filter.outputs['account-service'] }}" == 'true' || "${{ steps.filter.outputs.common }}" == 'true' ]]; then
            services+=("account-service")
          fi
          if [[ "${{ steps.filter.outputs['transaction-service'] }}" == 'true' || "${{ steps.filter.outputs.common }}" == 'true' ]]; then
            services+=("transaction-service")
          fi
          if [[ ${#services[@]} -eq 0 ]]; then
            json='[]'
          else
            json=$(printf '%s\n' "${services[@]}" | jq -R . | jq -sc .)
          fi
          echo "services=$json" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: Build & Test (${{ matrix.service }}, Java 21)
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Check formatting
        run: mvn --batch-mode -pl ${{ matrix.service }} -am spotless:check

      - name: Build and run tests
        run: mvn --batch-mode -pl ${{ matrix.service }} -am verify

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/
          retention-days: 7

  frontend-ci:
    name: Frontend CI
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.common == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npx vitest run
