server:
  port: 8081

spring:
  application:
    name: account-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgerwatch}
    username: ${DB_USERNAME:ledger}
    password: ${DB_PASSWORD:ledger}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: accounts
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    schemas: accounts
    default-schema: accounts