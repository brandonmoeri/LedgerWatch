server:
  port: 8082

spring:
  application:
    name: transaction-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgerwatch}
    username: ${DB_USERNAME:ledger}
    password: ${DB_PASSWORD:ledger}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: transactions
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    schemas: transactions
    default-schema: transactions

jwt:
  secret: ${JWT_SECRET}

account-service:
  base-url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
  connect-timeout: ${ACCOUNT_SERVICE_CONNECT_TIMEOUT:2s}
  read-timeout: ${ACCOUNT_SERVICE_READ_TIMEOUT:5s}

# Relays outbox_event rows to account-service (see OutboxPublisher).
outbox:
  publisher:
    enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
    poll-interval: ${OUTBOX_PUBLISHER_POLL_INTERVAL:1s}
    batch-size: 50
    lease: 2m                 # > a batch's worst-case delivery time, or it may be sent twice
    initial-backoff: 1s       # 1s, 2s, 4s ... per event after each transient failure
    max-backoff: 5m

# Fraud rules run by OutboxPublisher before each balance change (see FraudRuleEngine). In ENFORCE
# mode any hit rejects the transaction as SUSPECTED_FRAUD; MONITOR records hits and posts anyway.
fraud:
  enabled: ${FRAUD_RULES_ENABLED:true}
  mode: ${FRAUD_RULES_MODE:enforce}
  velocity:
    max-transactions: 10      # per account, counting this one, any type or status
    window: 10m
  amount-spike:
    multiplier: 3             # amount > 3x the average POSTED amount of the same type ...
    lookback: 30d             # ... over the 30 days before the transaction
    min-history: 3            # skipped with fewer prior transactions than this
  new-account:
    max-age: 24h              # accounts younger than this when the transaction was created ...
    large-debit-threshold: 1000   # ... may not DEBIT this much or more

# Resilience for AccountServiceClient. Only AccountServiceUnavailableException (I/O failure,
# timeout, 5xx) is retried or counted by the breaker; 4xx answers are final. Retries are safe
# because account-service applies each adjustment id (the transaction id) at most once.
resilience4j:
  retry:
    instances:
      accountService:
        max-attempts: 3                     # 1 call + 2 retries
        wait-duration: 200ms
        enable-exponential-backoff: true    # ~200ms, ~400ms ...
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 2s
        enable-randomized-wait: true        # +/-50% jitter so callers don't retry in lockstep
        randomized-wait-factor: 0.5
        retry-exceptions:
          - com.ledgerwatch.transactionservice.client.AccountServiceUnavailableException
  circuitbreaker:
    instances:
      accountService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        automatic-transition-from-open-to-half-open-enabled: true
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - com.ledgerwatch.transactionservice.client.AccountServiceUnavailableException

management:
  endpoints:
    web:
      exposure:
        # Everything but health requires ROLE_ADMIN (see SecurityConfig).
        include: health, metrics, circuitbreakers, circuitbreakerevents
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}   # a CloudWatch dimension

# Pushes the ledgerwatch.* meters (TransactionMetrics, OutboxBacklogMetrics) to CloudWatch; see
# CloudWatchMetricsConfig. Terraform turns it on for ECS. Needs cloudwatch:PutMetricData.
metrics:
  cloudwatch:
    enabled: ${METRICS_CLOUDWATCH_ENABLED:false}
    namespace: ${METRICS_CLOUDWATCH_NAMESPACE:LedgerWatch}
    step: 1m

# [correlationId] in text-format log lines (LOG_FORMAT=text); JSON lines carry it as a field.
logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
