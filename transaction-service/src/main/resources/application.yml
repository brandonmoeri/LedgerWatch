server:
  port: 8082

spring:
  application:
    name: transaction-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgerwatch}
    username: ${DB_USERNAME:ledger}
    password: ${DB_PASSWORD:ledger}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: transactions
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false